<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ THU CHI - CHI ĐOÀN BUÔN HAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0284c7', secondary: '#f97316' } } } }
    </script>
</head>
<body class="bg-slate-100 font-sans pb-10">

    <!-- HEADER -->
    <header class="bg-primary text-white p-4 shadow-lg text-center">
        <p class="text-[10px] uppercase font-bold text-orange-200">Đoàn xã Cư M'ta</p>
        <h1 class="text-sm font-extrabold uppercase">Chi đoàn Buôn Hai - Đắk</h1>
    </header>

    <main id="app" class="max-w-md mx-auto p-3 space-y-4">
        <!-- MÀN HÌNH CHÍNH: DANH SÁCH HOẠT ĐỘNG -->
        <div id="screenList" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border">
                <h3 class="font-bold text-slate-700 mb-3">TẠO HOẠT ĐỘNG MỚI</h3>
                <input type="text" id="actName" placeholder="Tên hoạt động (VD: Bóng đá Hè)" class="w-full text-xs p-2 border rounded mb-2">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="date" id="actFrom" class="text-xs p-2 border rounded">
                    <input type="date" id="actTo" class="text-xs p-2 border rounded">
                </div>
                <button onclick="addActivity()" class="w-full bg-primary text-white py-2 rounded font-bold text-xs">TẠO HOẠT ĐỘNG</button>
            </div>
            <div id="activityList" class="space-y-2"></div>
        </div>

        <!-- MÀN HÌNH CHI TIẾT: NHẬP THU CHI -->
        <div id="screenDetail" class="hidden space-y-4">
            <button onclick="showScreen('list')" class="text-xs text-primary font-bold"><i class="fa fa-arrow-left"></i> Quay lại danh sách</button>
            <div id="detailHeader" class="bg-white p-3 rounded shadow border border-primary"></div>
            
            <div class="bg-white rounded-xl p-4 shadow">
                <div class="flex space-x-2 mb-4">
                    <button id="btnT" onclick="switchForm('T')" class="flex-1 py-2 text-xs font-bold bg-blue-100 text-primary rounded">THU</button>
                    <button id="btnC" onclick="switchForm('C')" class="flex-1 py-2 text-xs font-bold bg-slate-100 text-slate-500 rounded">CHI</button>
                </div>
                <div class="space-y-2 text-xs">
                    <input type="datetime-local" id="inTime" class="w-full p-2 border rounded">
                    <input type="text" id="inNguoi" placeholder="Người thực hiện" class="w-full p-2 border rounded">
                    <input type="number" id="inTien" placeholder="Số tiền" class="w-full p-2 border rounded">
                    <input type="text" id="inNoiDung" placeholder="Nội dung" class="w-full p-2 border rounded">
                    <button onclick="saveTransaction()" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">LƯU GIAO DỊCH</button>
                </div>
            </div>
            <div id="transList" class="space-y-2"></div>
            <button onclick="exportPDF()" class="w-full bg-orange-600 text-white py-3 rounded font-bold text-xs">XUẤT BÁO CÁO HOẠT ĐỘNG</button>
        </div>
    </main>

    <script>
        let activities = JSON.parse(localStorage.getItem('acts')) || [];
        let currentActIdx = -1;
        let transType = 'T';

        function addActivity() {
            const name = document.getElementById('actName').value;
            const from = document.getElementById('actFrom').value;
            const to = document.getElementById('actTo').value;
            if(!name) return alert("Nhập tên hoạt động");
            activities.push({ name, from, to, trans: [] });
            localStorage.setItem('acts', JSON.stringify(activities));
            renderActs();
        }

        function renderActs() {
            const list = document.getElementById('activityList');
            list.innerHTML = activities.map((a, i) => `
                <div class="bg-white p-3 rounded shadow flex justify-between items-center">
                    <div onclick="openAct(${i})" class="flex-grow cursor-pointer">
                        <p class="font-bold text-sm">${a.name}</p>
                        <p class="text-[10px] text-slate-400">${a.from} đến ${a.to}</p>
                    </div>
                    <button onclick="delAct(${i})" class="text-rose-500 text-xs">Xóa</button>
                </div>
            `).join('');
        }

        function openAct(i) {
            currentActIdx = i;
            document.getElementById('screenList').classList.add('hidden');
            document.getElementById('screenDetail').classList.remove('hidden');
            document.getElementById('detailHeader').innerHTML = `<h2 class="font-bold text-primary">${activities[i].name}</h2><p class="text-[10px]">Quản lý thu chi hoạt động</p>`;
            renderTrans();
        }

        function showScreen(s) {
            document.getElementById('screenList').classList.remove('hidden');
            document.getElementById('screenDetail').classList.add('hidden');
        }

        function switchForm(t) {
            transType = t;
            document.getElementById('btnT').className = t=='T' ? 'flex-1 py-2 text-xs font-bold bg-blue-100 text-primary rounded' : 'flex-1 py-2 text-xs font-bold bg-slate-100 text-slate-500 rounded';
            document.getElementById('btnC').className = t=='C' ? 'flex-1 py-2 text-xs font-bold bg-orange-100 text-orange-600 rounded' : 'flex-1 py-2 text-xs font-bold bg-slate-100 text-slate-500 rounded';
        }

        function saveTransaction() {
            const t = {
                type: transType,
                time: document.getElementById('inTime').value,
                nguoi: document.getElementById('inNguoi').value,
                tien: parseFloat(document.getElementById('inTien').value),
                nd: document.getElementById('inNoiDung').value
            };
            activities[currentActIdx].trans.push(t);
            localStorage.setItem('acts', JSON.stringify(activities));
            renderTrans();
        }

        function renderTrans() {
            const list = document.getElementById('transList');
            list.innerHTML = activities[currentActIdx].trans.map((t, i) => `
                <div class="bg-white p-2 text-xs border-l-4 ${t.type=='T' ? 'border-blue-500' : 'border-orange-500'} flex justify-between">
                    <div><p class="font-bold">${t.nd}</p><p class="text-[9px]">${t.nguoi}</p></div>
                    <p class="font-bold">${t.type=='T'?'+':'-'}${t.tien.toLocaleString()}đ</p>
                </div>
            `).join('');
        }

        function delAct(i) { if(confirm("Xóa hoạt động này?")) { activities.splice(i, 1); localStorage.setItem('acts', JSON.stringify(activities)); renderActs(); } }

        function exportPDF() {
            alert("Tính năng PDF đang được tạo dựa trên dữ liệu hiện tại của hoạt động: " + activities[currentActIdx].name);
            // Bạn có thể copy logic tạo bảng từ file cũ vào đây để hoàn thiện phần xuất PDF cho từng hoạt động
        }

        renderActs();
    </script>
</body>
</html>
